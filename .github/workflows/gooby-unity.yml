# GOOBY iOS CI. Builds an unsigned .ipa from GOOBY-UNITY.
#
#   ios-xcode   Unity iOS export on Linux (BuildScript.BuildIOS, IL2CPP arm64, iOS 15).
#   ios-ipa     macOS xcodebuild without signing, then tools/ci/verify_unity_ipa.py.
#
# Secrets: UNITY_EMAIL, UNITY_PASSWORD, UNITY_LICENSE (Personal .ulf).
# The editor Library cache is the iOS one (Library-ios-…). A Linux Library is a
# different build target and is not restored here.
name: GOOBY Unity

on:
  push:
    branches: ["**"]
    paths:
      - "GOOBY-UNITY/**"
      - "tools/ci/verify_unity_ipa.py"
      - ".github/workflows/gooby-unity.yml"
  workflow_dispatch:

env:
  UNITY_VERSION: "6000.6.0f1"
  PROJECT_PATH: GOOBY-UNITY

concurrency:
  group: gooby-unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-xcode:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Unity-Secrets prüfen
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          missing=0
          for name in UNITY_EMAIL UNITY_PASSWORD UNITY_LICENSE; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name fehlt"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Persönliche Unity-Lizenz: E-Mail, Passwort und .ulf als Repository-Secrets setzen, dann den Workflow neu starten."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
      - uses: actions/cache@v4
        with:
          path: GOOBY-UNITY/Library
          key: Library-ios-${{ env.UNITY_VERSION }}-${{ hashFiles('GOOBY-UNITY/Packages/manifest.json') }}
          restore-keys: |
            Library-ios-${{ env.UNITY_VERSION }}-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: Gooby.Editor.BuildScript.BuildIOS
          buildName: GOOBY
          buildsPath: build
      - name: Xcode-Projekt packen
        run: |
          set -euo pipefail
          ls build/iOS
          tar -C build/iOS -czf xcode-project.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: GOOBY-unity-xcode-project
          path: xcode-project.tgz
          retention-days: 3

  ios-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    needs: ios-xcode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GOOBY-unity-xcode-project
          path: xcode
      - name: Xcode-Projekt entpacken
        run: |
          set -euo pipefail
          mkdir -p build/ios
          tar -C build/ios -xzf xcode/xcode-project.tgz
          ls build/ios
      - name: Info.plist reparieren
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          # Unity writes an empty internal DTD subset (`[]`) that Xcode 16 rejects.
          bad = b'PropertyList-1.0.dtd"[]>'
          good = b'PropertyList-1.0.dtd">'
          for path in Path("build/ios").rglob("*.plist"):
              data = path.read_bytes()
              if bad in data:
                  path.write_bytes(data.replace(bad, good))
                  print(f"fixed {path}")
          PY
      - name: xcodebuild (unsigned)
        run: |
          set -euo pipefail
          cd build/ios
          PROJ="$(find . -maxdepth 2 -name '*.xcodeproj' | head -1)"
          test -n "$PROJ"
          xcodebuild -project "$PROJ" -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO build
      - name: .ipa packen
        run: |
          set -euo pipefail
          cd build/ios
          APP_PATH="$(find dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry GOOBY-unity-unsigned.ipa Payload
          ls -la GOOBY-unity-unsigned.ipa
      - name: .ipa forensisch verifizieren
        run: python3 tools/ci/verify_unity_ipa.py build/ios/GOOBY-unity-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: GOOBY-unity-unsigned-ipa
          path: build/ios/GOOBY-unity-unsigned.ipa
